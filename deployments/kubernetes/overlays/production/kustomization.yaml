apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: sentinel
images:
  - name: sentinel
    newName: sentinel
    newTag: prod
patches:
  - target:
      kind: Deployment
      name: sentinel
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: HPA
      name: sentinel-hpa
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 10
