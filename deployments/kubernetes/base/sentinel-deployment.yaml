apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/part-of: cbs
    app.kubernetes.io/component: transaction-control-plane
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
        app.kubernetes.io/part-of: cbs
        app.kubernetes.io/component: transaction-control-plane
      annotations:
        checksum/config: sentinel-config
    spec:
      serviceAccountName: sentinel
      containers:
        - name: sentinel
          image: sentinel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: https
              containerPort: 8443
          env:
            - name: SENTINEL_ENV
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: SENTINEL_ENV
            - name: SENTINEL_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: SENTINEL_LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-database-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sentinel
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 20001
