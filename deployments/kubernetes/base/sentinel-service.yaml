apiVersion: v1
kind: Service
metadata:
  name: sentinel
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/part-of: cbs
    app.kubernetes.io/component: transaction-control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinel
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
